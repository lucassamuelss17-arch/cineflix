
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Catálogo de Filmes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #141414;
            color: white;
            margin: 0;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            color: #e50914;
            font-size: 40px;
        }

        .botao-cadastrar {
            background: #e50914;
            color: white;
            border: none;
            padding: 13px 22px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 15px;
            margin-bottom: 25px;
        }

		/* Grade de filmes */
		.grade-filmes {
		    display: grid;
		    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
		    gap: 25px;
		    margin-top: 30px;
		}

		/* Cada filme */
		.card-filme {
		    text-align: center;
		    transition: transform 0.3s;
		}

		.card-filme:hover {
		    transform: scale(1.05);
		}

		/* Pôster */
		.poster-filme {
		    width: 100%;
		    aspect-ratio: 2 / 3;
		    object-fit: cover;
		    border-radius: 10px;
		    display: block;
		}

		/* Título */
		.titulo-filme {
		    color: white;
		    text-decoration: none;
		    font-size: 15px;
		    display: block;
		    margin-top: 10px;
		}

		.titulo-filme:hover {
		    color: #e50914;
		}

        .vazio {
            text-align: center;
            padding: 30px;
            color: #bbb;
        }

        /* Fundo da janela */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Caixa do formulário */
        .modal-conteudo {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-conteudo h2 {
            color: #e50914;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        .botao-salvar {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .botao-fechar {
            background: #555;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 8px;
        }
		
		.pesquisa {
		    display: flex;
		    gap: 10px;
		    max-width: 600px;
		    margin-bottom: 20px;
		}

		.pesquisa input {
		    flex: 1;
		    padding: 12px;
		    background: #333;
		    color: white;
		    border: 1px solid #555;
		    border-radius: 5px;
		}

		.pesquisa button {
		    background: #e50914;
		    color: white;
		    border: none;
		    padding: 12px 18px;
		    border-radius: 5px;
		    cursor: pointer;
		}

		.limpar {
		    background: #555;
		    color: white;
		    text-decoration: none;
		    padding: 12px 15px;
		    border-radius: 5px;
		}
		
		/* Menu de três pontinhos */
		.menu-acoes {
		    position: absolute;
		    top: 20px;
		    left: 30px;
		    z-index: 200;
		}

		.botao-menu {
		    background-color: #e50914;
		    color: white;
		    border: none;
		    border-radius: 8px;
		    width: 45px;
		    height: 45px;
		    font-size: 28px;
		    cursor: pointer;
		}

		.botao-menu:hover {
		    background-color: #b80710;
		}

		/* Conteúdo que aparece ao clicar */
		.menu-conteudo {
		    display: none;
		    position: absolute;
		    left: 0;
		    top: 52px;
		    width: 280px;
		    background-color: #222;
		    border: 1px solid #444;
		    border-radius: 8px;
		    padding: 15px;
		    z-index: 100;
		    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
		}

		.menu-conteudo.aberto {
		    display: block;
		}
		
		.importar-container {
		    margin-top: 15px;
		    margin-bottom: 20px;
		}

		.importar-container form {
		    display: flex;
		    align-items: center;
		    gap: 10px;
		    flex-wrap: wrap;
		}

		.importar-container label {
		    color: white;
		}

		.importar-container select {
		    padding: 10px;
		    border-radius: 6px;
		    border: none;
		}

		.btn-importar {
		    background-color: #e50914;
		    color: white;
		    padding: 10px 18px;
		    border: none;
		    border-radius: 6px;
		    cursor: pointer;
		}

		.btn-importar:hover {
		    background-color: #b80710;
		}
		
		.btn-excluir-todos {
		    background-color: #e50914;
		    color: white;
		    padding: 10px 18px;
		    border: none;
		    border-radius: 6px;
		    cursor: pointer;
		    width: 100%;
		}

		.btn-excluir-todos:hover {
		    background-color: #b80710;
		}
		
		
		
    </style>
</head>

<body>

    <header>
        <h1>CineFlix</h1>
        <p>CATÁLOGO DE FILMES</p>
    </header>

    <main>

		
		<h2>Filmes cadastrados</h2>

		<!-- Menu de opções -->
		<div class="menu-acoes">

		    <button type="button" class="botao-menu" onclick="alternarMenu()">
		        ⋮
		    </button>

		    <div id="menuAcoes" class="menu-conteudo">

		        <h3>Opções do catálogo</h3>

		        <!-- Pesquisa -->
		        <form th:action="@{/}" method="get" class="pesquisa">
		            <input type="text" name="busca"
		                   placeholder="Pesquisar por título ou diretor..."
		                   th:value="${busca}">

		            <button type="submit">Pesquisar</button>
		            <a href="/" class="limpar">Limpar</a>
		        </form>

		        <hr>

		        <!-- Cadastro -->
		        <button type="button" class="botao-cadastrar"
		                onclick="abrirModal(); fecharMenu()">
		            + Cadastrar filme
		        </button>

		        <hr>

		        <!-- Importação -->
		        <div class="importar-container">
		            <form action="/importar" method="post">

		                <label for="quantidade">Quantidade de filmes:</label>

		                <select name="quantidade" id="quantidade">
		                    <option value="20">20 filmes</option>
		                    <option value="50">50 filmes</option>
		                    <option value="100">100 filmes</option>
		                    <option value="200" selected>200 filmes</option>
		                </select>

		                <button type="submit" class="btn-importar">
		                    Importar filmes
		                </button>

		            </form>
		        </div>
				
				<!-- Atualizar trailers -->
				<hr>

				<form action="/atualizar-trailers" method="post">

				    <button type="submit" class="btn-importar">
				        Atualizar trailers dos filmes
				    </button>

				</form>
				
				<!-- Excluir todos os filmes -->
				<hr>

				<form th:action="@{/excluir-todos}"
				      method="post"
				      onsubmit="return confirm('ATENÇÃO! Deseja realmente excluir todos os filmes do catálogo? Esta ação não poderá ser desfeita.')">

				    <button type="submit"
				            class="btn-excluir-todos">

				        Excluir todos os filmes do catálogo

				    </button>

				</form>

		    </div>
		</div>
		
		

        <table>
			<div class="grade-filmes">

			    <div class="card-filme" th:each="filme : ${filmes}">

			        <a th:href="@{/detalhes/{id}(id=${filme.id})}">

			            <img th:if="${filme.posterPath != null and !filme.posterPath.isEmpty()}"
			                 th:src="'https://image.tmdb.org/t/p/w342' + ${filme.posterPath}"
			                 alt="Pôster do filme"
			                 class="poster-filme">

			        </a>

			        <a th:href="@{/detalhes/{id}(id=${filme.id})}"
			           th:text="${filme.titulo}"
			           class="titulo-filme">
			        </a>

			    </div>

			</div>
        </table>

    </main>

    <!-- Janela de cadastro -->
    <div id="modalCadastro" class="modal">

        <div class="modal-conteudo">

            <h2>Cadastrar novo filme</h2>

            <form th:action="@{/salvar}" th:object="${filme}" method="post">

                <label>Título:</label>
                <input type="text" th:field="*{titulo}" required>

                <label>Diretor:</label>
                <input type="text" th:field="*{diretor}" required>

                <label>Ano de lançamento:</label>
                <input type="number" th:field="*{anoLancamento}">

                <label>Gênero:</label>
                <input type="text" th:field="*{genero}">

                <label>Duração (minutos):</label>
                <input type="number" th:field="*{duracao}">

                <label>Sinopse:</label>
                <textarea th:field="*{sinopse}" rows="4"></textarea>

                <button type="submit" class="botao-salvar">
                    Salvar filme
                </button>

                <button type="button" class="botao-fechar"
                    onclick="fecharModal()">
                    Cancelar
                </button>

            </form>

        </div>
    </div>

    <script>
        function abrirModal() {
            document.getElementById("modalCadastro").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modalCadastro").style.display = "none";
        }
		function alternarMenu() {
		    document.getElementById("menuAcoes").classList.toggle("aberto");
		}

		function fecharMenu() {
		    document.getElementById("menuAcoes").classList.remove("aberto");
		}
		document.addEventListener("click", function(event) {
		    const areaMenu = document.querySelector(".menu-acoes");

		    if (!areaMenu.contains(event.target)) {
		        fecharMenu();
		    }
		});
    </script>

</body>
</html>
